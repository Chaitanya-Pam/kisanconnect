<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KisanConnect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="mobile-app">

<!-- ================= Splash ================= -->

<section id="screenSplash" class="screen active">

<div class="center-screen">



<h1 class="mt-3">
KisanConnect
</h1>

<p id="splashText">
Smart Farming Assistant
</p>

<button
class="btn btn-success mt-4"
id="startBtn">

Start

</button>

</div>

</section>

<!-- ================= Language ================= -->

<section id="screenLanguage" class="screen">

<div class="container py-4">

<h2 class="text-center mb-4">

Select Language

</h2>

<div class="d-grid gap-3">

<button
class="btn btn-outline-success language-btn"
data-lang="en">

English

</button>

<button
class="btn btn-outline-success language-btn"
data-lang="te">

తెలుగు

</button>

<button
class="btn btn-outline-success language-btn"
data-lang="hi">

हिन्दी

</button>

</div>

</div>

</section>

<!-- ================= Home ================= -->

<section id="screenHome" class="screen">

<div class="container py-4">

<h2 id="homeTitle">

Welcome

</h2>

<p id="homeSubtitle">

Choose your crop

</p>

<button
class="btn btn-success w-100 mt-4"
id="goCrop">

Continue

</button>

</div>

</section>

<!-- ================= Crop Selection ================= -->

<section id="screenCrop" class="screen">
    <div class="container py-4">
        <button class="btn btn-sm btn-secondary mb-3" onclick="showScreen('screenHome')">← Back</button>
        <h2 id="cropTitle">Select Crop</h2>
<h2 id="cropTitle">
Select Crop
</h2>

</h2>

<div
class="row g-3 mt-2"
id="cropContainer">

</div>

</div>

</section>

<!-- ================= Disease Selection ================= -->

<section id="screenDisease" class="screen">

<div class="container py-4">

<h2 id="diseaseTitle">

Select Disease

</h2>
<button class="btn btn-sm btn-secondary mb-3" onclick="showScreen('screenCrop')">← Back</button>
<div
class="row g-3 mt-2"
id="diseaseContainer">

</div>

</div>

</section>

<!-- ================= Recommendation ================= -->

<section id="screenRecommendation" class="screen">

<div class="container py-4">
<button class="btn btn-sm btn-secondary mb-3" onclick="showScreen('screenDisease')">← Back</button>
<h2 id="recommendationTitle">

Recommendation

</h2>

<div
id="recommendationContent">

</div>

<button
class="btn btn-success w-100 mt-4"
id="companyButton">

View Companies

</button>

</div>

</section>

<!-- ================= Company List ================= -->

<section id="screenCompanies" class="screen">

<div class="container py-4">
<button class="btn btn-sm btn-secondary mb-3" onclick="showScreen('screenRecommendation')">← Back</button>
<h2 id="companyListTitle">

Companies

</h2>

<div
class="list-group"
id="companyList">

</div>

</div>

</section>

<!-- ================= Company Details ================= -->

<section id="screenCompanyDetails" class="screen">

<div class="container py-4">
<button class="btn btn-sm btn-secondary mb-3" onclick="showScreen('screenCompanies')">← Back</button>
<h2 id="companyDetailsTitle">

Company Details

</h2>

<div
id="companyDetails">

</div>

</div>

</section>

</div>

<script src="js/database.js"></script>

<script src="js/app.js"></script>

<script src="js/diagnosisss.js"></script>

</body>
</html>
